name: Build Kernel with MemKernel

on:
  push:
    branches: [ MemSploit ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CLANG_DIR: /tmp/clang-r416183b
      MAKE_ARGS: LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expand KernelSU submodule history
        run: git -C KernelSU fetch --unshallow --tags

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc cpio libssl-dev xz-utils dwarves libc6-dev-arm64-cross

      - name: Fetch Clang Toolchain
        run: |
          curl -sSL -o /tmp/clang.tar.gz https://codeload.github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tar.gz/refs/heads/lineage-20.0
          mkdir -p "$CLANG_DIR"
          tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Integrate MemKernel (Static, In-Tree)
        run: |
          if [ -d "drivers/memkernel" ]; then
            echo "[+] Using local MemKernel copy"
            grep -q "memkernel" drivers/Makefile || echo 'obj-$(CONFIG_MEMKERNEL) += memkernel/' >> drivers/Makefile
            grep -q "drivers/memkernel/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/memkernel/Kconfig"' drivers/Kconfig
          else
            echo "[!] Local MemKernel not found. Aborting."
            exit 1
          fi
          echo "CONFIG_MEMKERNEL=y" >> arch/arm64/configs/bg6_defconfig

      - name: Build Kernel
        run: |
          export PATH="$CLANG_DIR/bin:$PATH"
          make O=out ARCH=arm64 bg6_defconfig
          make O=out $MAKE_ARGS -j$(nproc)
